<!DOCTYPE html>
<html>

<head>
    <title>高爆魔力</title>
    <meta charset='utf-8' />
    <meta name='renderer' content='webkit' />
    <meta name='viewport'
        content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no' />
    <meta name='apple-mobile-web-app-capable' content='yes' />
    <meta name='full-screen' content='true' />
    <meta name='x5-fullscreen' content='true' />
    <meta name='360-fullscreen' content='true' />
    <meta name='laya' screenorientation='portrait' />
    <meta http-equiv='expires' content='0' />
    <meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1' />
    <meta http-equiv='expires' content='0' />
    <meta http-equiv='Cache-Control' content='no-siteapp' />
    <link rel="shortcut icon" href="#" />
    <script src="../game.js"></script>
    <script src="handle.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 头部区域样式 */
        #header {
            background-color: #333;
            color: white;
            padding: 10px;
            /* display: flex; */
            justify-content: space-between;
            align-items: center;
        }

        /* 刷新按钮样式 */
        #refresh-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        /* iframe样式 */
        iframe {
            width: 100%;
            height: calc(100vh - 50px);
            /* 减去头部区域的高度 */
            border: none;
        }

        /* 导航栏样式 */
        #sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 390px;
            height: 100vh;
            background-color: #333;
            color: white;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            /* 新增滚动相关样式 */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            /* 用于iOS平滑滚动 */
        }

        #sidebar.open {
            transform: translateX(0);
        }

        #sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            padding-bottom: 20px;
        }

        #sidebar ul li {
            padding: 10px;
            border-bottom: 1px solid #555;
        }

        #sidebar ul li a {
            color: white;
            text-decoration: none;
        }

        #sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #444;
        }

        #sidebar-title {
            margin: 0;
            color: white;
        }

        #close-sidebar-button {
            background-color: transparent;
            color: white;
            border: none;
            /* cursor: pointer; */
            font-size: 1.5em;
        }
    </style>
</head>

<body>
    <!-- 头部区域 -->
    <div id="header">
        <!-- <h1>高爆魔力</h1> -->
        <div>
            <span>账号前缀：<input type="text" id="account-prefix" style="width: 80px;" placeholder="如 test"> </span>
            <span id="mini-game-span">起始： <input id="account-start" value="100" style="width: 35px;"></span>
            <span id="mini-game-span">终止： <input id="account-end" value="101" style="width: 35px;"></span>
            <span id="mini-game-span">密码： <input id="account-password" placeholder="*******"
                    style="width: 55PX;"></span>
            <span id="mini-game-span">真实姓名： <input id="truename" placeholder="张三" style="width: 55px;"></span>
            <span id="mini-game-span">身份证： <input id="idcard" placeholder="110202503302245"
                    style="width: 120PX;"></span>
            <span>选择平台：
                <select id="platform-list">
                    <option>106u</option>
                    <option>zuixinwan</option>
                </select>
            </span>
            <button id="create-account" onclick="handleCreateAccountonClick()">开始建号</button>
            <span id="account-status">准备中...</span>
        </div>
    </div>

    <!-- 内容区域，使用iframe嵌套 -->
    <iframe id="content-frame" src=""></iframe>

    <script>
        // 获取按钮元素
        const accountPrefix = document.getElementById('account-prefix');
        const accountPassword = document.getElementById('account-password');
        const accountStart = parseInt(document.getElementById('account-start').value);
        const accountEnd = parseInt(document.getElementById('account-end').value);
        const truename = document.getElementById('truename');
        const idcard = document.getElementById('idcard');
        const accountStatus = document.getElementById('account-status');

        handleCreateAccountonClick = () => {
            prepare_account(accountPrefix.value, accountPassword.value, truename.value, idcard.value, accountStart, accountEnd);
        }

        // 获取iframe元素
        const contentFrame = document.getElementById('content-frame');

        // 定义新的src内容
        const newSrc = "http://example.com/new-page.html"; // 替换为您想要的新src内容

        // 导航栏
        function handleToggleButtonClick(event) {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
            event.stopPropagation(); // 阻止事件冒泡
        }

        // 关闭导航栏事件
        function handleCloseSidebarButtonClick() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('open');
        }

        // 等待iframe加载完成
        window.onload = function () {
            // 移除之前可能添加的事件监听器
            accountLoginButton.removeEventListener('click', handleAccountLoginButtonClick);
            toggleButton.removeEventListener('click', handleToggleButtonClick);
            battleMonsterButton.removeEventListener('click', handleBattleMonsterButtonClick);
            enterGameButton.removeEventListener('click', handleEnterGameButtonClick);
            enterMapButton.removeEventListener('click', handleEnterMapButtonClick);
            closeSidebarButton.removeEventListener('click', handleCloseSidebarButtonClick);
            hunterButton.removeEventListener('click', handlehunterButtonClick);

            // 重新添加事件监听器
            accountLoginButton.addEventListener('click', handleAccountLoginButtonClick);
            toggleButton.addEventListener('click', handleToggleButtonClick);
            battleMonsterButton.addEventListener('click', handleBattleMonsterButtonClick);
            enterGameButton.addEventListener('click', handleEnterGameButtonClick);
            enterMapButton.addEventListener('click', handleEnterMapButtonClick);
            closeSidebarButton.addEventListener('click', handleCloseSidebarButtonClick);
            hunterButton.addEventListener('click', handlehunterButtonClick);
        };

        // 处理加载失败的情况
        contentFrame.onerror = function () {
            reject(new Error("iframe 加载失败"));
        };

        // 监听来自 iframe 的消息
        window.addEventListener("message", function (event) {
            // 处理消息
            if (event.data.type === "iframeMethodResult") {
                console.log("收到 iframe 的消息:", event.data.result);
                // 获取iframe元素
                const contentFrame = document.getElementById('content-frame');

                // 改写iframe的src内容
                contentFrame.src = event.data.result;

            } else if (event.data.type === "iframeMethodError") {
                console.error("iframe 方法调用失败:", event.data.error);
            }
        });


    </script>
</body>

</html>
