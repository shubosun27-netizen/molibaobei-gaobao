<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>账号管理</title>
    <style>
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn {
            margin-left: 10px;
            padding: 8px 12px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .game-id-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .game-id-group input {
            flex: 1;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>账号管理</h2>

        <!-- 新增邀请码输入 -->
        <div class="input-group">
            <label for="invite-code">邀请码</label>
            <input type="text" id="invite-code" placeholder="请输入邀请码">
        </div>

        <div class="input-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" placeholder="请输入手机号">
        </div>

        <div class="input-group">
            <label for="addDays">续期天数</label>
            <input type="number" id="addDays" placeholder="请输入续期天数" min="1">
        </div>

        <div class="input-group">
            <label for="privileges">授权权益</label>
            <select id="privileges" multiple>
                <option value="基础配置项">基础配置项</option>
                <option value="超值配置项">超值配置项</option>
                <option value="小游戏相关">小游戏功能</option>
                <option value="自动练小号">自动练号功能</option>
            </select>
        </div>

        <div class="game-id-container">
            <div class="input-group game-id-group">
                <label>新增游戏ID</label>
                <input type="text" class="game-id" placeholder="请输入游戏ID">
            </div>
        </div>

        <button onclick="addGameIdField()">添加游戏ID</button>
        <button onclick="handleUpdate()">更新账号信息</button>
    </div>

    <script>
        // 将removeGameId函数移到全局作用域
        function removeGameId(button) {
            const container = button.closest('.game-id-group');
            container.remove();
        }

        function addGameIdField() {
            const container = document.querySelector('.game-id-container');
            const newField = document.createElement('div');
            newField.className = 'input-group game-id-group';
            newField.innerHTML = `
                <label>新增游戏ID</label>
                <input type="text" class="game-id" placeholder="请输入游戏ID">
                <button class="delete-btn" onclick="removeGameId(this)">删除</button>
            `;
            container.appendChild(newField);
        }

        async function handleUpdate() {
            const inviteCode = document.getElementById('invite-code').value;
            const phone = document.getElementById('phone').value;
            const addDays = parseInt(document.getElementById('addDays').value) || 0;
            const gameIds = Array.from(document.querySelectorAll('.game-id'))
                .map(input => {
                    const value = input.value.trim();
                    if (value.startsWith('http')) {
                        const url = new URL(value);
                        return url.searchParams.get('openID') || value;
                    }
                    return value;
                })
                .filter(id => id !== '');
            const privileges = Array.from(document.getElementById('privileges').selectedOptions)
                .map(option => option.value);

            // 验证邀请码
            if (!inviteCode) {
                alert('请输入邀请码');
                return;
            }

            // 验证手机号
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入有效的手机号');
                return;
            }

            // 验证续期天数
            if (isNaN(addDays) || addDays < 1) {
                alert('请输入有效的续期天数');
                return;
            }

            // 验证游戏ID
            if (gameIds.length === 0) {
                alert('请至少输入一个游戏ID');
                return;
            }

            try {
                const response = await fetch('/v1/3rd/api/updateUser', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('accessToken')
                    },
                    body: JSON.stringify({
                        inviteCode,
                        phone,
                        addDays,
                        privileges,
                        gameIds
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('账号信息更新成功');
                    window.location.reload();
                } else {
                    alert(result.message || '更新失败');
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
                console.error(error);
            }
        }

        // 新增：获取用户信息函数
        async function fetchUserInfo(phone) {
            const inviteCode = document.getElementById('invite-code').value;

            // 验证邀请码
            if (!inviteCode) {
                alert('请输入邀请码');
                return;
            }

            try {
                const response = await fetch('/v1/3rd/api/getUsers', {
                    method: 'GET',
                    headers: {
                        'Authorization': localStorage.getItem('accessToken'),
                        'Invite-Code': inviteCode
                    }
                });
                const result = await response.json();
                if (result.success) {
                    const user = result.data.find(u => u.phone === phone);
                    if (user) {
                        // 填充表单
                        document.getElementById('addDays').value = '';
                        document.getElementById('privileges').value = user.privileges;

                        // 清空并填充游戏ID
                        const container = document.querySelector('.game-id-container');
                        container.innerHTML = '';
                        user.game_ids.forEach(gameId => {
                            const newField = document.createElement('div');
                            newField.className = 'input-group game-id-group';
                            newField.innerHTML = `
                                <label>游戏ID</label>
                                <input type="text" class="game-id" value="${gameId}" readonly>
                                <button class="delete-btn" onclick="removeGameId(this)">删除</button>
                            `;
                            container.appendChild(newField);
                        });
                    } else {
                        alert('未找到该用户信息');
                    }
                } else {
                    alert(result.message || '获取用户信息失败');
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
                console.error(error);
            }
        }

        // 修改：手机号输入框添加失焦事件
        document.getElementById('phone').addEventListener('blur', function () {
            const phone = this.value;
            if (phone && phone.match(/^\d{11}$/)) {
                fetchUserInfo(phone);
            }
        });

    </script>
</body>

</html>
